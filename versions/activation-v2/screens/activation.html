<!doctype html>
<!-- Store Activation discovery v2 — desktop only (addenda 031, 032). Under 1024 px the page is locked.
     The engine and seed data are loaded for when a screen needs them. -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>FoodBridge · Store activation v2</title>
  <link rel="icon" href="activation/mascot.png">
  <link rel="stylesheet" href="activation/style.css">
</head>
<body>
  <main id="app" class="desk"></main>

  <section class="lock" aria-labelledby="lock-t">
    <span class="face"><img src="activation/mascot.png" alt=""></span>
    <svg class="pc" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
    <h1 id="lock-t">Set up your store on a computer</h1>
    <p>Store activation needs a bigger screen. Open this link on your laptop or desktop.</p>
    <button id="copylink" type="button">Copy link</button>
    <span id="copied" class="done" role="status"></span>
  </section>

  <script src="../seed-data/seed.js"></script>
  <script src="activation/engine.js"></script>
  <script src="activation/app.js"></script>
</body>
</html>
